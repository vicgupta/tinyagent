# Example skill-harness workflow: tinyagent --workflow docs/workflows/workflow.yaml -t "..."
# The workflow file is YAML; each stage's skill is a Markdown file in skills/ (<name>.md or <name>/SKILL.md).
version: 1
skills_dir: skills
default: implement
defaults:
  retries: 1
  step_limit: 50
workflows:
  implement:
    intent: Implement a feature from a spec, then validate, test and verify its behavior.
    stages:
      - skill: plan-tasks
        gate: spec
        inputs:
          contracts_dir: docs/contracts
      - skill: generate-code
        step_limit: 100
      - skill: validate-diff
        check: [go, vet, ./...]
      - skill: run-tests
        check: [go, test, -count=1, ./...]
        check_timeout: 600
      - skill: verify-behavior
        behavior: .tinyagent/behavior.yaml
  contract:
    intent: Write or update a stable contract reference doc for one surface of a repository.
    stages:
      - skill: write-contract
        inputs:
          contracts_dir: docs/contracts
        # Passes when a contract doc with the header exists; change the path if you change contracts_dir.
        check: [grep, -rqE, "^# Contract: ", docs/contracts]
